<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<title>RiskLens video stage</title>
<style>
@font-face { font-family: "Inter"; font-weight: 400 700; src: url("/assets/fonts/inter-latin.woff2") format("woff2"); }
html, body { margin: 0; padding: 0; background: #fbfbfd; }
#stage { width: 1280px; height: 720px; overflow: hidden; }
#stage svg { display: block; }
/* warm the fonts so canvas measurement is accurate */
.warm { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="warm"><span style="font-family:Inter;font-weight:400">a</span><span style="font-family:Inter;font-weight:600">a</span><span style="font-family:Inter;font-weight:700">a</span></div>
<div id="stage"></div>
<script src="engine.js"></script>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('v');
  var s = document.createElement('script');
  s.src = 'specs/' + slug + '.js';
  s.onload = function () {
    Promise.all([
      document.fonts.load('400 20px Inter'), document.fonts.load('600 20px Inter'),
      document.fonts.load('700 20px Inter')
    ]).then(function () { return document.fonts.ready; }).then(function () {
      RLV.load(window.RL_SPEC);
      var t = parseFloat(new URLSearchParams(location.search).get('t') || '0');
      RLV.renderAt(t);
      window.__ready = true;
    });
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
