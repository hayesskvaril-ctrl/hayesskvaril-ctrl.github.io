name: Suggest a correction
description: Report an error, an out-of-date requirement or a broken link on RiskLens Australia.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep RiskLens Australia accurate. Please don't include personal or confidential information: this report is public.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page (filled in automatically if you came from the site).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or out of date?
      description: Quote the sentence if you can.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Official source
      description: A link to the legislation, regulator guidance or other source that shows the correct position (optional, but it speeds things up).
