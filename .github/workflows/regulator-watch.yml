# Weekly regulator watch. Runs on GitHub's free hosted runners, which can read regulator websites directly.
# 1. Lists new announcements and consultations from APRA, ASIC, AUSTRAC, the OAIC, the ACCC, Treasury, the ASD
#    and the Attorney-General's Department, with the site pages each may affect.
# 2. Looks for every fact in the key facts register (_scripts/facts/facts.json) on its official source page.
# Results are saved on the "watch-data" branch (not published). If there is anything new to look at, it opens a
# GitHub issue labelled "regulator-watch". See _scripts/UPDATES.md.
name: Weekly regulator watch

on:
  schedule:
    - cron: "23 20 * * 0"   # 20:23 UTC on Sunday: Monday morning in eastern Australia
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: regulator-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the previous watch results
        uses: actions/checkout@v4
        with:
          ref: watch-data
          path: watch-out

      - name: Run the watch
        run: python3 _scripts/watch/watch.py --state watch-out

      - name: Save the results to the watch-data branch
        working-directory: watch-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Regulator watch $(date -u +%F)" || echo "nothing to save"
          git push -q origin HEAD:watch-data

      - name: Open an issue if there is anything new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f watch-out/issue_title.txt ]; then
            gh label create regulator-watch --color 1D76DB --description "Weekly regulator watch" --force
            gh issue create --title "$(cat watch-out/issue_title.txt)" --body-file watch-out/latest_report.md --label regulator-watch
          else
            echo "Nothing new this week."
          fi
