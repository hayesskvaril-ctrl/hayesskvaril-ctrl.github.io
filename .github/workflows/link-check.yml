# Monthly check that links to outside sites (regulators, legislation, research) still work.
# Runs on GitHub's free hosted runners. If any link is broken, it opens an issue listing them.
# Internal links are checked locally by _scripts/check_links.py instead (--root-dir lets this check read them
# as local files, which the scheme filter then skips). AUSTRAC's server rejects this checker's connection type
# (HTTP/2), so its links are skipped here; the weekly regulator watch reads AUSTRAC pages with a different client.
name: Monthly external link check

on:
  schedule:
    - cron: "17 21 1 * *"   # 21:17 UTC on the 1st of each month (early morning on the 2nd in eastern Australia)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --max-concurrency 4
            --max-retries 3
            --timeout 30
            --accept 200..=299,403,429
            --root-dir ${{ github.workspace }}
            --exclude-path _scripts
            --exclude-path .github
            --exclude 'austrac\.gov\.au'
            './**/*.html'
          output: ./lychee-report.md
          fail: false

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken outside links found by the monthly check"
          content-filepath: ./lychee-report.md
          labels: broken-links
