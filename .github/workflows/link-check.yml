# Monthly check that links to outside sites (regulators, legislation, research) still work.
# Runs on GitHub's free hosted runners using _scripts/check_external.py (plain HTTP/1.1 requests, one site
# at a time with pauses; several government sites reject the HTTP/2 connections used by common link
# checkers). If any link is broken or failing, it opens an issue listing them with the pages they are on.
# Internal links are checked locally by _scripts/check_links.py instead.
name: Monthly external link check

on:
  schedule:
    - cron: "17 21 1 * *"   # 21:17 UTC on the 1st of each month (early morning on the 2nd in eastern Australia)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Check outside links
        run: python3 _scripts/check_external.py --out external-links-report.md

      - name: Open an issue if links are broken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f external-links-report.md.broken ]; then
            gh label create broken-links --color D93F0B --description "Broken outside links" --force
            gh issue create --title "Broken outside links found by the monthly check ($(date -u +%F))" --body-file external-links-report.md --label broken-links
          else
            echo "No broken links."
          fi
